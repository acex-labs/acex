hostname sto-office1-acc-stack-1
!
ip domain-name office.example.com
!
username admin privilege 15 secret 9 $9$obfuscated
!
interface GigabitEthernet1/0/1
 description Phone-SEP3F4E5D6C7B01
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 no shutdown
!
interface GigabitEthernet2/0/1
 description Phone-SEP3F4E5D6C7B02
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 no shutdown
!
interface GigabitEthernet3/0/1
 description Phone-SEP3F4E5D6C7B03-Relocated
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 no shutdown
!
interface GigabitEthernet1/0/49
 description UPLINK-sto-office1-dist-1
 switchport trunk allowed vlan 10,20,30,50,99
 switchport mode trunk
 no shutdown
!
interface GigabitEthernet2/0/49
 description UPLINK-sto-office1-dist-2
 switchport trunk allowed vlan 10,20,30,50,99
 switchport mode trunk
 no shutdown
!
interface Vlan99
 description MGMT
 ip address 10.10.99.13 255.255.255.0
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.10.99.1
!
line vty 0 4
 transport input ssh
!
end
