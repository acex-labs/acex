hostname sto-office1-acc-2
!
ip domain-name office.example.com
!
username admin privilege 15 secret 9 $9$obfuscated
!
interface GigabitEthernet1/0/1
 description Phone-SEP2A3B4C5D6E01
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 no shutdown
!
interface GigabitEthernet1/0/2
 description Phone-SEP2A3B4C5D6E02
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 no shutdown
!
interface GigabitEthernet1/0/49
 description UPLINK-sto-office1-dist-2-Primary
 switchport trunk allowed vlan 10,20,30,50,99
 switchport mode trunk
 no shutdown
!
interface Vlan99
 description MGMT
 ip address 10.10.99.12 255.255.255.0
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.10.99.1
!
line vty 0 4
 transport input ssh
!
end
