hostname sto-office1-dist-2
!
ip domain-name office.example.com
!
username admin privilege 15 secret 9 $9$obfuscated
!
vlan 10
 name DATA
vlan 20
 name VOICE
vlan 30
 name WIFI
vlan 50
 name GUEST
vlan 99
 name MGMT
!
interface GigabitEthernet1/0/1
 description UPLINK-sto-office1-core-1
 no switchport
 ip address 10.10.1.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0/2
 description DOWNLINK-sto-office1-acc-2
 switchport trunk allowed vlan 10,20,30,99
 switchport mode trunk
 no shutdown
!
interface GigabitEthernet1/0/3
 description DOWNLINK-sto-office1-acc-stack-1-Redundant
 switchport trunk allowed vlan 10,20,30,99
 switchport mode trunk
 no shutdown
!
interface Vlan10
 description DATA-gateway
 ip address 10.10.10.3 255.255.255.0
 standby 1 ip 10.10.10.1
 standby 1 priority 90
 no shutdown
!
interface Vlan20
 description VOICE-gateway
 ip address 10.10.20.3 255.255.255.0
 standby 1 ip 10.10.20.1
 standby 1 priority 90
 no shutdown
!
interface Vlan30
 description WIFI-gateway
 ip address 10.10.30.3 255.255.255.0
 standby 1 ip 10.10.30.1
 standby 1 priority 90
 no shutdown
!
interface Vlan50
 description GUEST-gateway
 ip address 10.10.50.3 255.255.255.0
 standby 1 ip 10.10.50.1
 standby 1 priority 90
 no shutdown
!
interface Vlan99
 description MGMT-gateway
 ip address 10.10.99.3 255.255.255.0
 standby 1 ip 10.10.99.1
 standby 1 priority 90
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.10.1.5
!
line vty 0 4
 transport input ssh
!
end
