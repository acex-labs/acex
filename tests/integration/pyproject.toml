[tool.poetry]
name = "acex-integration-tests"
version = "0.2.0"
description = "Cross-package integration tests for ACE-X — verifies backend, devkit and drivers work together from source before a release."
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
acex = { path = "../../backend", develop = true }
acex-devkit = { path = "../../devkit", develop = true }
acex-client = { path = "../../client", develop = true }
acex-driver-cisco-ioscli = { path = "../../drivers/cisco_ios_cli", develop = true }
acex-driver-juniper-junoscli = { path = "../../drivers/juniper_junos_cli", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[tool.pytest.ini_options]
addopts = "--tb=line"
