# git-cliff configuration
# Generates backend/src/acex/CHANGELOG.md — served via GET /api/v1/changelog
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to the ACEX backend will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits -%}
        - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
          {% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }})){% endif %}{{ "\n" }}
        {%- set_global kept = [] -%}
        {%- for line in commit.body | default(value="") | split(pat="\n") -%}
            {%- if line is not starting_with("* ") and line is not containing("Co-authored-by") and line is not starting_with("---") -%}
                {%- set_global kept = kept | concat(with=[line]) -%}
            {%- endif -%}
        {%- endfor -%}
        {%- set body_text = kept | join(sep="\n") | trim -%}
        {%- if body_text -%}
            {{ "\n" }}
            {%- for line in body_text | split(pat="\n") -%}
                {{ "    >" }}{% if line | trim | length > 0 %} {{ line }}{% endif %}{{ "\n" }}
            {%- endfor -%}
        {%- endif -%}
    {% endfor %}
{% endfor %}
{% endif %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = [
  { pattern = "<REPO>", replace = "https://github.com/acex-labs/acex" },
  # Turn "(#306)" into a markdown link to the PR
  { pattern = '\(#(\d+)\)', replace = "([#$1](https://github.com/acex-labs/acex/pull/$1))" },
]

[git]
conventional_commits = true
filter_unconventional = false
sort_commits = "oldest"
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
commit_parsers = [
  { message = "^feat",                          group = "Added" },
  { message = "^fix",                           group = "Fixed" },
  { message = "^perf",                          group = "Performance" },
  { message = "^refactor",                      group = "Changed" },
  { message = "^docs",                          group = "Documentation" },
  { message = "^test|^chore|^ci|^build|^style", skip = true },
  { message = "^Merge (pull request|branch)",   skip = true },
  { body  = ".*security",                       group = "Security" },
  { message = '\(#\d+\)',                       group = "Other" },
  { message = ".*",                             skip = true },
]
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/acex-labs/acex/pull/$1" },
]
