# Every fixture, what it stands for and the facts of evidence/register.toml it rests on.
# All of them are synthetic: names, addresses and numbers are made up (documentation address ranges
# 192.0.2.0/24, 198.51.100.0/24 and 203.0.113.0/24). The layout follows the sources, the content is ours.
# synthetic-layout = "verified"  the layout is shown by a source we have read
#                    "assumed"   the layout is our guess (the file name says .assumed)

[[fixture]]
path = "device/asr6000-6.3.5/running-config.txt"
scenario = "a"
layout = "verified"
facts = ["RUNCFG-COMMAND", "RUNCFG-HEADER", "RUNCFG-INDENT", "RUNCFG-ORDER", "RUNCFG-END-MARKER", "STANZA-SYNTAX", "INTERFACE-NAMES"]
note = "ASR6000 structure with different names and addresses; blank lines between stanzas as in the document (RUNCFG-BLOCK-SEPARATOR is unknown)"

