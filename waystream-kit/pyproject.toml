[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibos-kit"
version = "0.1.0"
description = "Development kit for a Waystream iBOS driver: SSH mock, fixtures, evidence register and driver exercises"
requires-python = ">=3.13"
dependencies = ["asyncssh>=2.14"]

[project.optional-dependencies]
driver = ["scrapli[asyncssh]>=2024.1.30,<2025", "asyncssh>=2.14", "pydantic>=2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["exercise/src"]
addopts = "-m 'not experimental'"
markers = [
    "experimental: exercises the unverified configuration-mode profile; deselected by default",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
