# What we know about the Waystream iBOS command line, and how we know it.
#
# level  VERIFIED  a source we have read says it, in this form
#        INFERRED  derived from a source that does not say it directly (one user report, a sibling product,
#                  or the shape of a third-party driver); useful for rehearsing, not for claiming
#        UNKNOWN   no source; the mock either does not simulate it or simulates it as a labelled assumption
# basis  manufacturer-doc | third-party-driver | third-party-report | real-device | none
#        VERIFIED needs manufacturer-doc, third-party-driver or real-device. A third-party-report is never
#        more than INFERRED. UNKNOWN has basis none and says how to find out (verify).
# assumed  true when the mock answers anyway, so a test passing against it proves nothing about the device
#
# No real device has been available. Every VERIFIED entry therefore rests on documents or on Oxidized's model,
# and a document is not a device: the command reference describes MS 7000 on 7.5.2, and the other documents
# describe MS4000 and ASR6000 on 6.3.x. Each "introduced in" release below comes from the command reference.

[[source]]
id = "S1"
kind = "manufacturer-doc"
title = "Waystream SKA/SEC Certifiering (published by SSNF)"
url = "https://www.ssnf.org/globalassets/nat-i-varldsklass/sakerhet/ska/certifierade-produkter-dokument-pdf/ska-sec-waystream.pdf"
read = "2026-11-13; pages 5-9 rendered to images and read as images (text extraction fragments the tables); not copied, fixtures are synthetic"
covers = "ASR6000 and MS4000 on iBOS 6.3.5-ED-R: show running-config, show running-configuration context, show ip int br, show clients"

[[source]]
id = "S2"
kind = "manufacturer-doc"
title = "MS4000 Installation Guide, chapter Troubleshooting iBOS"
url = "https://netcon.store/media/pdf/98/30/06/MS4000-Installation-Guide_compressed.pdf"
read = "2026-11-13; printed pages 26-29 (PDF pages 30-33) rendered to images and read as images"
covers = "MS4026-AC on iBOS 6.3.0-ED-R: login, show version, show pfdp neighbours, show interface sfp, show ip bootp, show vlan, show csar"

[[source]]
id = "S3"
kind = "third-party-driver"
title = "Oxidized model ibos.rb"
url = "https://github.com/ytti/oxidized/blob/4d6dcd671284/lib/oxidized/model/ibos.rb"
read = "2026-11-13; commit 4d6dcd671284 (2026-11-13) of the file, master at 52c7767f5381; previous change of the file 3f4c2ec01fcc (2024-10-16)"
covers = "prompt pattern, enable handling, terminal commands, secret syntax, volatile lines"

[[source]]
id = "S4"
kind = "third-party-report"
title = "Oxidized issue 2774, Problem with Waystream switches (IBOS)"
url = "https://github.com/ytti/oxidized/issues/2774"
read = "2026-11-13; opened 2023-04-28, one comment, closed 2023-07-19 as not planned (label Stale); no confirmed fix"
covers = "one MS7048-AC on iBOS 7.6.2-GD-R answering show running-config with an error"

[[source]]
id = "S5"
kind = "real-device"
title = "none"
url = ""
read = "no real iBOS device has been reachable during this work"
covers = "nothing"

[[source]]
id = "S6"
kind = "manufacturer-doc"
title = "iBOS MS 7000 7.5.2-ED-R Command Line Reference (WS-DOC-IBOS-MS7K-7.5.2-ED-R-CMD, revision A, 2019-10-15)"
url = ""
read = "2026-11-14; 612 pages, text extracted and the key pages checked as images; page numbers here are PDF pages (printed page plus 12). The document's copyright text forbids distribution, so it is cited and not included, and where the copy came from is not recorded"
covers = "MS 7000 on 7.5.2-ED-R: every command with its context, syntax, default, privilege level and the release that introduced it"

# ---------------------------------------------------------------- login and prompt

[[fact]]
id = "PROMPT-MODES"
topic = "prompt"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S1 p5-9", "S2 p26-29", "S6 p98 and p104"]
statement = "The prompt is the hostname followed by > in user mode and # in admin mode (ms>, ms#, ibos>, ibos#, ASR6K-SKA-Test#). In configuration mode the context follows the hostname: (config)#, (config-if-eth)#, (config-if-ge)#, (config-if-te)#, (config-if-lo)#, (config-if-vlan)# and others."

[[fact]]
id = "PROMPT-PATTERN"
topic = "prompt"
level = "VERIFIED"
basis = "third-party-driver"
sources = ["S3"]
statement = "Oxidized finds the prompt with ^([\\w.@()-]+[#>]\\s?)$, so the hostname part may hold letters, digits, underscore, dot, at, parentheses and hyphen. The parentheses are needed for configuration mode; the manual allows less in a hostname (HOSTNAME-RULES)."

[[fact]]
id = "HOSTNAME-RULES"
topic = "prompt"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p124"]
statement = "A hostname may contain only a-z, A-Z, 0-9 and hyphen and is at most 63 characters. The default hostname depends on the hardware platform."

[[fact]]
id = "PROMPT-TRAILING-SPACE"
topic = "prompt"
level = "UNKNOWN"
basis = "none"
sources = []
statement = "Whether the prompt is followed by a space. Oxidized allows one; a prompt that ends in a space once broke a prompt pattern on another vendor."
assumed = true
verify = "Capture the raw bytes after the prompt (ssh with a pty and hexdump) on a real switch."

[[fact]]
id = "LOGIN-LANDING-MODE"
topic = "login"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p590", "S6 p98", "S6 p104"]
statement = "A user lands in user mode unless the account has privilege admin, which exists from iBOS 7.3; before that every user starts in user mode and needs enable. The default privilege is user. An account with privilege admin lands in admin mode and needs no enable."

[[fact]]
id = "LOGIN-NO-DEFAULT-CREDENTIALS"
topic = "login"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S2 p26", "S6 p590"]
statement = "On the console an unconfigured switch has no default user name or password: Enter at both prompts. With no user configured any user name and password work on the console, but login over telnet or ssh is impossible. Once authentication is configured the right credentials are needed."

[[fact]]
id = "SSH-SERVER-FIRMWARE"
topic = "ssh"
level = "INFERRED"
basis = "manufacturer-doc"
sources = ["S6 p554-556", "S6 p566", "S6 p553"]
statement = "The sshd configuration command and the ssh client command were introduced in iBOS 6.3.4. The telnet daemon (telnetd) has existed since 2.0. A switch older than 6.3.4 therefore probably has no SSH server and can only be reached by telnet."
reasoning = "The manual dates the command, not the server itself; nothing says what an older switch does on port 22. The 6.3.0 profile of the mock offers SSH anyway."
assumed = true
verify = "Ask the customer which firmware each switch runs, and try ssh to one older than 6.3.4 before building a telnet transport."

[[fact]]
id = "SSH-SERVER-DEFAULTS"
topic = "ssh"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p554-556", "S6 p566"]
statement = "sshd defaults: SSH version 2 only, port 22, 10 concurrent clients, 6 password attempts, 120 seconds to log in, SFTP off. Login with a public key (sshd authorized-key, falling back to password) exists from 7.3.0. telnetd allows 15 clients."

[[fact]]
id = "SSH-AUTH-METHODS"
topic = "ssh"
level = "UNKNOWN"
basis = "none"
sources = []
statement = "The key exchange, host key and cipher lists of the SSH server, whether it offers keyboard-interactive, and whether it needs a pty. The manual says only that password login works and that public keys work from 7.3.0."
assumed = true
verify = "ssh -vvv to the switch and keep the output of the negotiation; try the transport with default algorithms first."

[[fact]]
id = "ENABLE-COMMAND"
topic = "login"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p104-105", "S3"]
statement = "enable takes no argument and changes from user mode to admin mode. It asks for the password set with enable secret when one exists. Oxidized sends enable plain, or answers a Password: prompt after it (^[pP]assword:). disable goes back."

[[fact]]
id = "ENABLE-WITHOUT-SECRET"
topic = "login"
level = "INFERRED"
basis = "manufacturer-doc"
sources = ["S6 p105"]
statement = "With no enable secret configured, enable is assumed to change to admin mode without a question."
reasoning = "The manual says the secret is the password the user must enter, and does not say what happens when there is none."
assumed = true
verify = "On a switch with no enable secret: enable, and read what comes back."

[[fact]]
id = "ENABLE-WRONG-PASSWORD"
topic = "login"
level = "UNKNOWN"
basis = "none"
sources = []
statement = "What the device prints when the enable password is wrong, and whether it limits attempts."
assumed = true
verify = "Only with the customer's agreement: one wrong attempt, then read the answer. Do not repeat; accounts may lock."

[[fact]]
id = "ADMIN-LEVEL-COMMANDS"
topic = "login"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p504", "S6 p519", "S6 p61", "S6 p72", "S6 p98"]
statement = "Every command has a privilege level. Admin: show running-config, show startup-config, show logging, show tech-support, configure terminal, copy, reload, the clear commands. User: show version, show vlan, show interface, show ip interface brief, show lldp neighbours, show clients, show csar and the terminal commands. User mode does not offer configuration commands or anything that can affect performance."

[[fact]]
id = "TERMINAL-COMMANDS"
topic = "session"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p568-569", "S3"]
statement = "terminal width <1-65535> and terminal lines <1-65535> exist from 2.1, at user level. terminal [no] pager exists only from 6.3.10, so older firmware answers terminal no pager with an error, and it is not needed there because the pager is off by default (PAGER-BEHAVIOUR). Oxidized sends terminal no pager and terminal width 65535 on every iBOS device."

[[fact]]
id = "PAGER-BEHAVIOUR"
topic = "session"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p569-570", "S6 p527"]
statement = "The pager is off by default, for the console and for all other terminals; terminal default-pager (6.3.10) turns it on at login, terminal [no] pager changes it for the session. When on it pauses the output of every show command after one screen, and the space bar continues. The idle timeout is 300 seconds by default (terminal timeout)."

[[fact]]
id = "PAGER-PROMPT-TEXT"
topic = "session"
level = "UNKNOWN"
basis = "none"
sources = []
statement = "What the pager prints at a pause and how it ends when nobody answers. The mock has no pager."
verify = "Turn the pager on with terminal pager (6.3.10 or later) and run show running-config; keep the raw bytes."

[[fact]]
id = "COMMAND-ABBREVIATION"
topic = "cli"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S2 p29 (sh vlan)", "S1 p6 (sh ip int br)", "S6 p99 and p115 (conf t, int et1/2, sh run, no shut)"]
statement = "Commands and keywords can be shortened to a prefix: sh vlan, sh ip int br, conf t, int et1/2, sh run context interface et1/2, no shut. What an ambiguous prefix answers is not shown. The mock accepts only sh, int and br."

[[fact]]
id = "ERROR-FORMAT"
topic = "cli"
level = "INFERRED"
basis = "third-party-report"
sources = ["S4"]
statement = "An unknown command is answered with a line '%-ERR: <the command line>' and a line with carets under the offending word followed by ' Invalid command'."
reasoning = "One report, one command: 'show running-config' gives carets (14) under 'running-config' starting at column 12. The command reference documents no error text, and other errors (ambiguous, incomplete, wrong argument) are not shown anywhere."
assumed = true
verify = "Send a misspelled command, an incomplete one and one with a bad argument; keep all three answers."

# ---------------------------------------------------------------- show running-config

[[fact]]
id = "RUNCFG-COMMAND"
topic = "running-config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S1 p5 (ASR6000)", "S1 p9 (MS4000)", "S6 p504", "S3"]
statement = "show running-config [context <string> | debug | group <string>] prints the active configuration and works exactly as write terminal. It exists from iBOS 2.0 and is an admin-level command (ADMIN-LEVEL-COMMANDS)."

[[fact]]
id = "RUNCFG-7X-REJECTED"
topic = "running-config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p504", "S6 p98"]
statement = "show running-config needs admin mode, so a session in user mode is refused. One user report has an MS7048-AC on 7.6.2-GD-R answering it with an error and a maintainer suggesting enable; the manual explains why."

[[fact]]
id = "RUNCFG-7X-AFTER-ENABLE"
topic = "running-config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p104"]
statement = "In admin mode, after enable, all commands are available, show running-config included."

[[fact]]
id = "RUNCFG-HEADER"
topic = "running-config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S1 p5", "S1 p9", "S6 p504"]
statement = "The output starts with one comment line '! version <image> (<image>.bz2)', for example ibos-asr6k-6.3.5-ED-R or ibos-ms7k-6.3.4-ED-R."

[[fact]]
id = "RUNCFG-INDENT"
topic = "running-config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S1 p5-6", "S1 p9", "S6 p504"]
statement = "Lines inside an interface are indented by one space. The certification document separates interface blocks with a blank line; the manual's excerpts show none (RUNCFG-BLOCK-SEPARATOR)."

[[fact]]
id = "RUNCFG-DOC-INDENT-ARTIFACT"
topic = "running-config"
level = "INFERRED"
basis = "manufacturer-doc"
sources = ["S1 p8", "S6 p128"]
statement = "Several lines of the MS4000 example on page 8 have no indentation (port type, ip access-group, description) and one interface is written 'tengigabitethernet 1' with a space. The same lines are indented on page 9, so this is read as a typesetting artifact, not as device output. The manual says the space between an interface name and its number was removed in iBOS 3.1, so the spaced spelling is an old one."
reasoning = "Same firmware and same lines indented on the next page; a parser that depends on indentation should still not break on it."
verify = "Compare with the real show running-config of an MS4000."

[[fact]]
id = "RUNCFG-ORDER"
topic = "running-config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S1 p5-6"]
statement = "On the ASR6000 example the order is interfaces (loopback, gigabitethernet, tengigabitethernet, downstream), router ospf, hostname, access-list, service-definition, service-selection, then '!end'. Hostname is a top-level line written after the interfaces."

[[fact]]
id = "RUNCFG-ORDER-MS4K"
topic = "running-config"
level = "INFERRED"
basis = "manufacturer-doc"
sources = ["S1 p8-9", "S6 p504"]
statement = "On MS4000 and 7.x the order of ASR6000 is assumed: interfaces first, then hostname, access-list, and the '!end' marker. The MS4000 example starts at the base configuration and shows no hostname line; the MS 7000 excerpt starts with interface vlan1 and the ethernet ports."
reasoning = "Same operating system family and the same printing code is likely, but no MS4000 or MS 7000 example shows the whole output."
assumed = true
verify = "Read the whole show running-config of an MS4000 and of an MS 7000."

[[fact]]
id = "RUNCFG-END-MARKER"
topic = "running-config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S1 p6", "S6 p99"]
statement = "The ASR6000 example ends with the line '!end' before the prompt, and so does the manual's example of show run context interface. The certification document's context example (S1 p9) has no '!end'."

[[fact]]
id = "RUNCFG-BLOCK-SEPARATOR"
topic = "running-config"
level = "UNKNOWN"
basis = "none"
sources = []
statement = "Whether a real device separates top-level stanzas with a blank line (as the certification document shows), with '!' or with nothing (as the manual's excerpts show). Either document may have reformatted it."
assumed = true
verify = "Look at the raw bytes of a real show running-config between two interfaces."

[[fact]]
id = "VOLATILE-LINES"
topic = "running-config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S1 p6 (ASR6000)", "S1 p9 (MS4000)", "S6 p213"]
statement = "Lines that a script or DHCP snooping adds at run time are printed with a leading '!volatile' after the indentation, for example '!volatile policy-map vid 2 snpa <mac> <ip>/32 seq 10 policy', '!volatile interface arp entry <ip> <mac> client' and '!volatile macff server <ip> arp'. They vanish when the client does."

[[fact]]
id = "VOLATILE-STRIPPING"
topic = "running-config"
level = "VERIFIED"
basis = "third-party-driver"
sources = ["S3"]
statement = "Oxidized deletes every line that contains '!volatile' before it stores the configuration."

[[fact]]
id = "RUNCFG-CONTEXT"
topic = "running-config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S1 p9", "S6 p99"]
statement = "show running-config context <string>, written show running-configuration context interface <name> in the certification document and show run context interface et1/2 in the manual, prints the version comment line and that interface's block."

[[fact]]
id = "INTERFACE-NAMES"
topic = "running-config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S1 p5-8", "S2 p29", "S6 p128", "S6 p504", "S6 p477"]
statement = "Interface names depend on the product line. MS 7000 (and an MS4126 in the manual's LLDP example) use ethernetS/P such as ethernet1/1, plus vlanN and tunnelN; MS4000 and ASR6000 on 6.3.x use gigabitethernetN, tengigabitethernetN, loopbackN and downstreamN. All lower case, number attached. The configuration context is named after the type: eth, ge, te, lo, downstream, vlan, vid, tun."

[[fact]]
id = "INTERFACE-NO-SHUTDOWN"
topic = "running-config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S1 p5-8", "S6 p531"]
statement = "An enabled interface carries 'no shutdown'. Shutdown is the default state of every interface (since iBOS 2.1), so a port without that line is disabled."

[[fact]]
id = "INTERFACE-DISABLED-FORM"
topic = "running-config"
level = "INFERRED"
basis = "manufacturer-doc"
sources = ["S6 p531", "S1 p8"]
statement = "A disabled interface is the default state, so it is expected to print no line at all; whether a 'shutdown' line is ever printed is not shown."
reasoning = "No example shows a disabled port, and the certification document's uplink port tengigabitethernet1 has no 'no shutdown' either, which may be an omission."
assumed = true
verify = "Shut one lab port on a real switch and read the block, and read the block of a port that was never configured."

[[fact]]
id = "STANZA-SYNTAX"
topic = "running-config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S1 p5-9", "S6 p504"]
statement = "Seen verbatim: hostname <name>; ip address <ip> <mask>; description <text>; vlan member <id>; vlan untagged <id>; port type uni|nni vlan <id>; port uplink; ip access-group <name> in; ip strict-clients; arp proxy; ip dhcp relay script; ip dhcp snoop information-tag policy drop; ip dhcp auto-policy-map snoop vlan <id>; access-list <name> with ' seq <n> permit|deny ...'; router ospf; service-definition; service-selection; parameter dhcp ..."

