# ---------------------------------------------------------------- secrets

[[fact]]
id = "SECRET-SYNTAX-SNMP-RADIUS"
topic = "secrets"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p58", "S6 p230", "S6 p307", "S6 p532", "S3"]
statement = "Secrets Oxidized masks: 'community <NAME> read-only|read-write view <V>' and 'notify <ip> community <NAME> trap|inform', both inside 'snmp-group version 1|2c [NAME]', and 'radius server <ip|host> secret <s> [port|retry|timeout]' at the top level. The manual shows the same lines."

[[fact]]
id = "SECRET-SYNTAX-OTHER"
topic = "secrets"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p105", "S6 p62", "S6 p590", "S6 p560", "S6 p533", "S6 p230", "S6 p189", "S6 p18"]
statement = "The other places a secret is typed on 7.5.2: 'enable secret <pw> [encrypted]'; 'console password <pw> [encrypted]' (6.3.11); 'username <u> [role li] password <pw> [encrypted]'; 'tacacs-plus [seq n] server <ip|host> secret <s> [port|timeout]'; inside an snmp-group: 'snmp-user <u> password <pw> [encrypted|sha]' and 'notify <ip> user <u> password <pw> [sha]'; 'license <program> <key>'; 'parameter ... secret <name>' for scripts. Passwords may be stored as crypt() hashes (aaa password encryption des|md5|blowfish, from 6.5; default md5). Oxidized masks none of these. Older firmware may lack some, and a real configuration may print others."

# ---------------------------------------------------------------- configuration mode

[[fact]]
id = "CONFIG-MODE-ENTRY"
topic = "config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p61", "S6 p106", "S6 p115", "S6 p99"]
statement = "configure terminal (conf t), from admin mode, enters configuration mode and the prompt gains the context: host(config)#, then host(config-if-eth)# after interface ethernet1/1. end leaves to admin mode, exit goes up one context (and logs out of user and admin mode), do <exec command> runs an exec command from configuration mode. It exists from iBOS 2.0. The mock offers it only behind --experimental-config-mode because it has not been tried on a device."

[[fact]]
id = "CONFIG-SAVE-COMMIT"
topic = "config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p599", "S6 p72", "S6 p519"]
statement = "A configuration line takes effect in the running configuration at once. write or write memory saves it to the startup configuration on flash and answers 'Wrote N bytes compressed configuration (M bytes uncompressed)'; write terminal prints it; write erase removes the stored one. No commit and no rollback command appears in the manual."

[[fact]]
id = "CONFIG-ERROR-FEEDBACK"
topic = "config"
level = "UNKNOWN"
basis = "none"
sources = []
statement = "How a rejected configuration line is reported, and whether the rest of a pasted block is still applied. The manual documents no error text."
assumed = true
verify = "Send one valid and one invalid line to a lab switch and keep the answer."

[[fact]]
id = "BECS-NET-BOOT"
topic = "config"
level = "VERIFIED"
basis = "manufacturer-doc"
sources = ["S6 p59", "S6 p519"]
statement = "config-register net-boot is on by default: iBOS can take its uplink addresses from BOOTP and its configuration and image updates from a central system over CSAR, for example BECS. A switch that gets its configuration from BECS reads the running configuration from there at each restart and needs no startup configuration. A change written directly to such a switch may therefore not survive a restart."

