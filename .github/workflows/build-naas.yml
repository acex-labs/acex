on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  trigger-naas-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitLab pipeline
        run: |
          curl --fail -X POST \
            --form token=${{ secrets.GITLAB_TRIGGER_TOKEN }} \
            --form ref=main \
            --form "variables[BUILD_TARGET]=acex" \
            "https://gitlab.com/api/v4/projects/82550415/trigger/pipeline"
