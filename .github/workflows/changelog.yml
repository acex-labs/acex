name: Changelog

# dev is free: a pull request into dev is not asked for a changelog fragment. The entry is
# required when a package is sent to stage (the Release workflow), and for every changed
# component in a pull request into main. Fragments that exist must be well-formed.
# See docs/guides/changelog.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main, dev]

jobs:
  fragments:
    name: Changelog entry
    runs-on: ubuntu-latest
    # A draft is not ready for review, and the Release workflow's own pull request only stamps versions
    # and compiles notes.
    if: ${{ !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'no-changelog') && !startsWith(github.head_ref, 'chore/release-') }}
    steps:
      - name: Checkout (full history, for the diff against the target branch)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fragments are well-formed
        run: python scripts/changelog.py validate

      - name: Into main, changed components have an entry and the version carries its notes
        if: github.base_ref == 'main'
        run: python scripts/changelog.py check --base "origin/${{ github.base_ref }}" --release-ready

      - name: Compiled changelog files are current
        run: python scripts/changelog.py build --check
