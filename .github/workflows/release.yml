name: Release

# Run from the Actions tab on dev, or on a hotfix/* branch. The plan is shown in the run summary and
# the reviewers of the release environment approve before anything is committed.
# Sending packages to stage: channel rc on dev, with the packages to send. A package that changed
# since its last release without a changelog entry stops the plan.
# RELEASE_TOKEN lets the checks run on the release pull request, which the default token cannot start.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: rc cuts release candidates for stage (dev only), stable releases for prod
        type: choice
        options: [stable, rc]
        default: stable
      packages:
        description: Packages to send, ids or directories separated by spaces. Empty sends everything that is due
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.plan.outputs.due }}
    steps:
      - name: Only dev and hotfix branches are released
        if: github.ref_name != 'dev' && !startsWith(github.ref_name, 'hotfix/')
        run: |
          echo "::error::Run this workflow on dev, or on a hotfix/* branch, not on ${GITHUB_REF_NAME}"
          exit 1

      - name: Release candidates are cut on dev
        if: inputs.channel == 'rc' && github.ref_name != 'dev'
        run: |
          echo "::error::Release candidates are published from dev, not from ${GITHUB_REF_NAME}"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fragments are valid
        run: python scripts/changelog.py validate

      - name: What a release contains
        id: plan
        env:
          CHANNEL: ${{ inputs.channel }}
          PACKAGES: ${{ inputs.packages }}
          # The plan goes to a file together with the errors; unbuffered, the errors do not come before the plan.
          PYTHONUNBUFFERED: "1"
        run: |
          read -ra packages <<< "$PACKAGES"
          status=0
          python scripts/changelog.py plan --channel "$CHANNEL" "${packages[@]}" > "$RUNNER_TEMP/plan.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/plan.txt"
          if [ "$status" -ne 0 ]; then
            {
              echo "### The plan is stopped"
              echo
              echo '```'
              cat "$RUNNER_TEMP/plan.txt"
              echo '```'
              echo
              echo "Fix what is listed (write the entry, send a new candidate, or revert the change), then run the workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          if grep -q '^nothing to release' "$RUNNER_TEMP/plan.txt"; then
            echo "due=false" >> "$GITHUB_OUTPUT"
            hint="Nothing is due, so there is nothing to approve."
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
            hint="Approve the pending deployment of the Release job to release this."
          fi
          {
            echo "### Release plan (${CHANNEL}) for \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA::7}\`"
            echo
            echo "Chosen: ${PACKAGES:-everything that is due}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/plan.txt"
            echo '```'
            echo
            echo "$hint"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      CHANNEL: ${{ inputs.channel }}
      PACKAGES: ${{ inputs.packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Release what the plan contains
        run: |
          set -o pipefail
          read -ra packages <<< "$PACKAGES"
          python scripts/changelog.py release-all --channel "$CHANNEL" "${packages[@]}" | tee "$RUNNER_TEMP/release.txt"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(release): version what is due (${CHANNEL})" -m "$(cat "$RUNNER_TEMP/release.txt")"

      - name: Hotfix branch, push the commit to it
        if: github.ref_name != 'dev'
        run: git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Dev, open a pull request into dev
        if: github.ref_name == 'dev'
        run: |
          branch="chore/release-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          git push origin "HEAD:refs/heads/${branch}"
          {
            echo "Versions and release notes for ${PACKAGES:-everything that was due} at \`${GITHUB_SHA::7}\`,"
            echo "made by the Release workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/release.txt"
            echo '```'
            echo
            if [ "$CHANNEL" = "rc" ]; then
              echo "Merging this into dev publishes the release candidate images to GHCR."
            else
              echo "Merge this into dev, then open the pull request from dev into main: its merge publishes."
            fi
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base dev --head "$branch" \
            --title "chore(release): version what is due (${CHANNEL})" --body-file "$RUNNER_TEMP/body.md"
