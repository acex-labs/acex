name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    # Feature → stage (testar innan merge till stage)
    # Stage → main (testar + trigar release vid merge)
    branches: [ main, stage ]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      result: ${{ steps.ruff-check.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Ruff
        id: ruff-check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check ."

      - name: Check formatting
        if: always() # Kör även om lint-steget ovan failade jobbet.
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check ."
        continue-on-error: true # Rapporterande läge tills det initiala fel-bruset är åtgärdat.

  lint-per-package:
    name: Lint (Ruff) ${{ matrix.component }}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      backend-result: ${{ steps.result-backend.outputs.result }}
      cli-result: ${{ steps.result-cli.outputs.result }}
      client-result: ${{ steps.result-client.outputs.result }}
      mcp-result: ${{ steps.result-mcp.outputs.result }}
      devkit-result: ${{ steps.result-devkit.outputs.result }}
      worker-result: ${{ steps.result-worker.outputs.result }}
      cisco-ios-cli-result: ${{ steps.result-cisco-ios-cli.outputs.result }}
      juniper-junos-cli-result: ${{ steps.result-juniper-junos-cli.outputs.result }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, cli, client, mcp, devkit, worker, cisco_ios_cli, juniper_junos_cli]
        include:
          - component: backend
            working-dir: ./backend
          - component: cli
            working-dir: ./cli
          - component: client
            working-dir: ./client
          - component: mcp
            working-dir: ./mcp
          - component: devkit
            working-dir: ./devkit
          - component: worker
            working-dir: ./worker
          - component: cisco_ios_cli
            working-dir: ./drivers/cisco_ios_cli
          - component: juniper_junos_cli
            working-dir: ./drivers/juniper_junos_cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Ruff check
        id: ruff-check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check"
          src: ${{ matrix.working-dir }}

      - name: Check formatting
        id: ruff-format
        if: always() # Kör även om lint-steget ovan failade jobbet.
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check"
          src: ${{ matrix.working-dir }}
        continue-on-error: true # Rapporterande läge per paket, se pr-summary.

      - name: Combine result
        id: result
        if: always()
        run: |
          if [ "${{ steps.ruff-check.outcome }}" = "success" ] && [ "${{ steps.ruff-format.outcome }}" = "success" ]; then
            echo "result=ok" >> $GITHUB_OUTPUT
          elif [ "${{ steps.ruff-check.outcome }}" != "success" ]; then
            echo "result=lint-issues" >> $GITHUB_OUTPUT
          else
            echo "result=unformatted" >> $GITHUB_OUTPUT
          fi

      - name: Set matrix output
        id: result-backend
        if: always() && matrix.component == 'backend'
        run: echo "result=${{ steps.result.outputs.result }}" >> $GITHUB_OUTPUT

      - name: Set matrix output
        id: result-cli
        if: always() && matrix.component == 'cli'
        run: echo "result=${{ steps.result.outputs.result }}" >> $GITHUB_OUTPUT

      - name: Set matrix output
        id: result-client
        if: always() && matrix.component == 'client'
        run: echo "result=${{ steps.result.outputs.result }}" >> $GITHUB_OUTPUT

      - name: Set matrix output
        id: result-mcp
        if: always() && matrix.component == 'mcp'
        run: echo "result=${{ steps.result.outputs.result }}" >> $GITHUB_OUTPUT

      - name: Set matrix output
        id: result-devkit
        if: always() && matrix.component == 'devkit'
        run: echo "result=${{ steps.result.outputs.result }}" >> $GITHUB_OUTPUT

      - name: Set matrix output
        id: result-worker
        if: always() && matrix.component == 'worker'
        run: echo "result=${{ steps.result.outputs.result }}" >> $GITHUB_OUTPUT

      - name: Set matrix output
        id: result-cisco-ios-cli
        if: always() && matrix.component == 'cisco_ios_cli'
        run: echo "result=${{ steps.result.outputs.result }}" >> $GITHUB_OUTPUT

      - name: Set matrix output
        id: result-juniper-junos-cli
        if: always() && matrix.component == 'juniper_junos_cli'
        run: echo "result=${{ steps.result.outputs.result }}" >> $GITHUB_OUTPUT

  unit-tests:
    name: Unit tests ${{ matrix.component }}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      backend-result: ${{ steps.result-backend.outputs.result }}
      cli-result: ${{ steps.result-cli.outputs.result }}
      client-result: ${{ steps.result-client.outputs.result }}
      mcp-result: ${{ steps.result-mcp.outputs.result }}
      devkit-result: ${{ steps.result-devkit.outputs.result }}
      worker-result: ${{ steps.result-worker.outputs.result }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, cli, client, mcp, devkit, worker]
        include:
          - component: backend
            working-dir: ./backend
          - component: cli
            working-dir: ./cli
          - component: client
            working-dir: ./client
          - component: mcp
            working-dir: ./mcp
          - component: devkit
            working-dir: ./devkit
          - component: worker
            working-dir: ./worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Update lock file
        working-directory: ${{ matrix.working-dir }}
        run: poetry lock

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ matrix.component }}-${{ hashFiles(format('{0}/poetry.lock', matrix.working-dir)) }}

      - name: Install dependencies
        working-directory: ${{ matrix.working-dir }}
        run: poetry install --no-interaction

      - name: Run tests
        id: run-tests
        working-directory: ${{ matrix.working-dir }}
        run: |
          # GitHub Actions kör run-steg med `set -e`, så vi måste fånga
          # exitkoden via `||` — annars avslutas skriptet redan på raden
          # nedan innan vi hinner tolerera "5 = inga tester" nedan.
          poetry run pytest || code=$?
          code=${code:-0}
          if [ "$code" -eq 5 ]; then
            echo "result=no-tests" >> $GITHUB_OUTPUT
            echo "Inga tester ännu i ${{ matrix.component }} — godkänt tills vidare."
            exit 0
          elif [ "$code" -eq 0 ]; then
            echo "result=passed" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "result=failed" >> $GITHUB_OUTPUT
            exit "$code"
          fi

      - name: Set matrix output
        id: result-backend
        if: always() && matrix.component == 'backend'
        run: echo "result=${{ steps.run-tests.outputs.result }}" >> $GITHUB_OUTPUT

      - name: Set matrix output
        id: result-cli
        if: always() && matrix.component == 'cli'
        run: echo "result=${{ steps.run-tests.outputs.result }}" >> $GITHUB_OUTPUT

      - name: Set matrix output
        id: result-client
        if: always() && matrix.component == 'client'
        run: echo "result=${{ steps.run-tests.outputs.result }}" >> $GITHUB_OUTPUT

      - name: Set matrix output
        id: result-mcp
        if: always() && matrix.component == 'mcp'
        run: echo "result=${{ steps.run-tests.outputs.result }}" >> $GITHUB_OUTPUT

      - name: Set matrix output
        id: result-devkit
        if: always() && matrix.component == 'devkit'
        run: echo "result=${{ steps.run-tests.outputs.result }}" >> $GITHUB_OUTPUT

      - name: Set matrix output
        id: result-worker
        if: always() && matrix.component == 'worker'
        run: echo "result=${{ steps.run-tests.outputs.result }}" >> $GITHUB_OUTPUT

  integration-tests:
    name: Cross-package integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      result: ${{ steps.run-tests.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Update lock file
        working-directory: ./tests/integration
        run: poetry lock

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-integration-${{ hashFiles('tests/integration/poetry.lock') }}

      - name: Install dependencies
        working-directory: ./tests/integration
        run: poetry install --no-interaction

      - name: Run integration tests
        id: run-tests
        working-directory: ./tests/integration
        run: poetry run pytest -v

  pr-summary:
    name: PR summary
    needs: [lint, lint-per-package, unit-tests, integration-tests]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Write combined summary
        env:
          LINT_RESULT: ${{ needs.lint.outputs.result }}
          LINT_BACKEND: ${{ needs.lint-per-package.outputs.backend-result }}
          LINT_CLI: ${{ needs.lint-per-package.outputs.cli-result }}
          LINT_CLIENT: ${{ needs.lint-per-package.outputs.client-result }}
          LINT_MCP: ${{ needs.lint-per-package.outputs.mcp-result }}
          LINT_DEVKIT: ${{ needs.lint-per-package.outputs.devkit-result }}
          LINT_WORKER: ${{ needs.lint-per-package.outputs.worker-result }}
          LINT_CISCO: ${{ needs.lint-per-package.outputs.cisco-ios-cli-result }}
          LINT_JUNIPER: ${{ needs.lint-per-package.outputs.juniper-junos-cli-result }}
          UT_BACKEND: ${{ needs.unit-tests.outputs.backend-result }}
          UT_CLI: ${{ needs.unit-tests.outputs.cli-result }}
          UT_CLIENT: ${{ needs.unit-tests.outputs.client-result }}
          UT_MCP: ${{ needs.unit-tests.outputs.mcp-result }}
          UT_DEVKIT: ${{ needs.unit-tests.outputs.devkit-result }}
          UT_WORKER: ${{ needs.unit-tests.outputs.worker-result }}
          IT_RESULT: ${{ needs.integration-tests.outputs.result }}
        run: |
          # Skriver ut en läsbar rad per testresultat. Samma "resultat"-koder
          # (success/failure/no-tests/ok/error) återanvänds från stegen ovan
          # istället för att gissa om varje jobb — se motsvarande steg för
          # exakt vad varje kod betyder.
          row() {
            local label="$1" result="$2"
            case "$result" in
              success|ok|passed) echo "| $label | ✅ OK |" >> $GITHUB_STEP_SUMMARY ;;
              no-tests) echo "| $label | ⏭️ Inga tester än |" >> $GITHUB_STEP_SUMMARY ;;
              failure|failed|error) echo "| $label | ❌ Fel |" >> $GITHUB_STEP_SUMMARY ;;
              lint-issues) echo "| $label | ❌ Lint-fel |" >> $GITHUB_STEP_SUMMARY ;;
              unformatted) echo "| $label | ⚠️ Ej formaterad (\`ruff format\`) |" >> $GITHUB_STEP_SUMMARY ;;
              *) echo "| $label | ⚠️ Okänt ($result) |" >> $GITHUB_STEP_SUMMARY ;;
            esac
          }

          echo "## 🔍 PR-kontroller" >> $GITHUB_STEP_SUMMARY
          echo "| Kontroll | Resultat |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          row "Lint (hela repot)" "$LINT_RESULT"
          row "Lint: backend" "$LINT_BACKEND"
          row "Lint: cli" "$LINT_CLI"
          row "Lint: client" "$LINT_CLIENT"
          row "Lint: mcp" "$LINT_MCP"
          row "Lint: devkit" "$LINT_DEVKIT"
          row "Lint: worker" "$LINT_WORKER"
          row "Lint: cisco_ios_cli" "$LINT_CISCO"
          row "Lint: juniper_junos_cli" "$LINT_JUNIPER"
          row "Unit tests: backend" "$UT_BACKEND"
          row "Unit tests: cli" "$UT_CLI"
          row "Unit tests: client" "$UT_CLIENT"
          row "Unit tests: mcp" "$UT_MCP"
          row "Unit tests: devkit" "$UT_DEVKIT"
          row "Unit tests: worker" "$UT_WORKER"
          row "Integration tests" "$IT_RESULT"

  slack-notify:
    name: Slack CI-rapport
    needs: [lint, lint-per-package, unit-tests, integration-tests, pr-summary]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Bygg Slack-payload och posta
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINT_RESULT: ${{ needs.lint.outputs.result }}
          LINT_BACKEND: ${{ needs.lint-per-package.outputs.backend-result }}
          LINT_CLI: ${{ needs.lint-per-package.outputs.cli-result }}
          LINT_CLIENT: ${{ needs.lint-per-package.outputs.client-result }}
          LINT_MCP: ${{ needs.lint-per-package.outputs.mcp-result }}
          LINT_DEVKIT: ${{ needs.lint-per-package.outputs.devkit-result }}
          LINT_WORKER: ${{ needs.lint-per-package.outputs.worker-result }}
          LINT_CISCO: ${{ needs.lint-per-package.outputs.cisco-ios-cli-result }}
          LINT_JUNIPER: ${{ needs.lint-per-package.outputs.juniper-junos-cli-result }}
          UT_BACKEND: ${{ needs.unit-tests.outputs.backend-result }}
          UT_CLI: ${{ needs.unit-tests.outputs.cli-result }}
          UT_CLIENT: ${{ needs.unit-tests.outputs.client-result }}
          UT_MCP: ${{ needs.unit-tests.outputs.mcp-result }}
          UT_DEVKIT: ${{ needs.unit-tests.outputs.devkit-result }}
          UT_WORKER: ${{ needs.unit-tests.outputs.worker-result }}
          IT_RESULT: ${{ needs.integration-tests.outputs.result }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL är inte satt — hoppar över Slack-notis."
            exit 0
          fi

          badge() {
            case "$1" in
              success|ok|passed) echo "✅" ;;
              no-tests) echo "⏭️" ;;
              failure|failed|error|lint-issues) echo "❌" ;;
              unformatted) echo "⚠️" ;;
              *) echo "❓" ;;
            esac
          }

          overall="✅ Alla checks gröna"
          for r in "$LINT_RESULT" "$LINT_BACKEND" "$LINT_CLI" "$LINT_CLIENT" "$LINT_MCP" "$LINT_DEVKIT" "$LINT_WORKER" "$LINT_CISCO" "$LINT_JUNIPER" "$UT_BACKEND" "$UT_CLI" "$UT_CLIENT" "$UT_MCP" "$UT_DEVKIT" "$UT_WORKER" "$IT_RESULT"; do
            case "$r" in
              success|ok|passed|no-tests|unformatted|"") ;;
              *) overall="❌ Minst en check failar"; break ;;
            esac
          done

          summary_text=$(cat <<EOF
          *Lint:* $(badge "$LINT_RESULT") repot · backend $(badge "$LINT_BACKEND") · cli $(badge "$LINT_CLI") · client $(badge "$LINT_CLIENT") · mcp $(badge "$LINT_MCP") · devkit $(badge "$LINT_DEVKIT") · worker $(badge "$LINT_WORKER") · cisco $(badge "$LINT_CISCO") · juniper $(badge "$LINT_JUNIPER")
          *Unit tests:* backend $(badge "$UT_BACKEND") · cli $(badge "$UT_CLI") · client $(badge "$UT_CLIENT") · mcp $(badge "$UT_MCP") · devkit $(badge "$UT_DEVKIT") · worker $(badge "$UT_WORKER")
          *Integration:* $(badge "$IT_RESULT")
          EOF
          )

          payload=$(jq -n \
            --arg text "CI-rapport för PR #${PR_NUMBER}" \
            --arg title "<${PR_URL}|#${PR_NUMBER} ${PR_TITLE}>" \
            --arg author "${PR_AUTHOR}" \
            --arg branches "\`${HEAD_BRANCH}\` → \`${BASE_BRANCH}\`" \
            --arg overall "${overall}" \
            --arg summary "${summary_text}" \
            --arg run_url "${RUN_URL}" \
            '{
              text: $text,
              blocks: [
                { type: "header", text: { type: "plain_text", text: ("CI-rapport: PR #" + env.PR_NUMBER) } },
                { type: "section", fields: [
                  { type: "mrkdwn", text: ("*PR:* " + $title) },
                  { type: "mrkdwn", text: ("*Författare:* " + $author) },
                  { type: "mrkdwn", text: ("*Branches:* " + $branches) },
                  { type: "mrkdwn", text: ("*Status:* " + $overall) }
                ]},
                { type: "section", text: { type: "mrkdwn", text: $summary } },
                { type: "actions", elements: [
                  { type: "button", text: { type: "plain_text", text: "Öppna PR" }, url: env.PR_URL },
                  { type: "button", text: { type: "plain_text", text: "Visa CI-körning" }, url: $run_url }
                ]}
              ]
            }')

          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" > /dev/null
          echo "Slack-notis skickad."

  check-versions:
    name: Check version ${{ matrix.package }}
    runs-on: ubuntu-latest
    outputs:
      backend-should-publish: ${{ steps.check-backend.outputs.should-publish }}
      backend-version: ${{ steps.check-backend.outputs.version }}
      cli-should-publish: ${{ steps.check-cli.outputs.should-publish }}
      cli-version: ${{ steps.check-cli.outputs.version }}
      client-should-publish: ${{ steps.check-client.outputs.should-publish }}
      client-version: ${{ steps.check-client.outputs.version }}
      mcp-should-publish: ${{ steps.check-mcp.outputs.should-publish }}
      mcp-version: ${{ steps.check-mcp.outputs.version }}
      devkit-should-publish: ${{ steps.check-devkit.outputs.should-publish }}
      devkit-version: ${{ steps.check-devkit.outputs.version }}
    strategy:
      matrix:
        package: [backend, cli, client, mcp, devkit]
        include:
          - package: backend
            pypi-name: acex
            working-dir: ./backend
          - package: cli
            pypi-name: acex-cli
            working-dir: ./cli
          - package: client
            pypi-name: acex-client
            working-dir: ./client
          - package: mcp
            pypi-name: acex-mcp-server
            working-dir: ./mcp
          - package: devkit
            pypi-name: acex-devkit
            working-dir: ./devkit
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
    
    - name: Get package version
      id: get-version
      working-directory: ${{ matrix.working-dir }}
      run: |
        VERSION=$(poetry version -s)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Package version: $VERSION"
    
    - name: Check if version exists on PyPI
      id: check-pypi
      run: |
        PACKAGE_NAME="${{ matrix.pypi-name }}"
        VERSION="${{ steps.get-version.outputs.version }}"
        
        # Kolla om versionen redan finns på PyPI
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${PACKAGE_NAME}/${VERSION}/json")

        if [ "$HTTP_CODE" = "200" ]; then
          echo "should-publish=false" >> $GITHUB_OUTPUT
          echo "⏭️  Version $VERSION already exists on PyPI - skipping"
        else
          echo "should-publish=true" >> $GITHUB_OUTPUT
          echo "✅ Version $VERSION is new - will build and publish"
        fi

    - name: Set matrix output
      id: check-backend
      if: matrix.package == 'backend'
      run: |
        echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT
        echo "version=${{ steps.get-version.outputs.version }}" >> $GITHUB_OUTPUT

    - name: Set matrix output
      id: check-cli
      if: matrix.package == 'cli'
      run: |
        echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT
        echo "version=${{ steps.get-version.outputs.version }}" >> $GITHUB_OUTPUT

    - name: Set matrix output
      id: check-client
      if: matrix.package == 'client'
      run: |
        echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT
        echo "version=${{ steps.get-version.outputs.version }}" >> $GITHUB_OUTPUT

    - name: Set matrix output
      id: check-mcp
      if: matrix.package == 'mcp'
      run: |
        echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT
        echo "version=${{ steps.get-version.outputs.version }}" >> $GITHUB_OUTPUT

    - name: Set matrix output
      id: check-devkit
      if: matrix.package == 'devkit'
      run: |
        echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT
        echo "version=${{ steps.get-version.outputs.version }}" >> $GITHUB_OUTPUT

  build-packages:
    name: Build ${{ matrix.package }}
    needs: check-versions
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false  # Fortsätt med andra paket även om ett failar
      matrix:
        package: [backend, cli, client, mcp, devkit]
        include:
          - package: backend
            pypi-name: acex
            should-publish-output: backend-should-publish
            working-dir: ./backend
          - package: cli
            pypi-name: acex-cli
            should-publish-output: cli-should-publish
            working-dir: ./cli
          - package: client
            pypi-name: acex-client
            should-publish-output: client-should-publish
            working-dir: ./client
          - package: mcp
            pypi-name: acex-mcp-server
            should-publish-output: mcp-should-publish
            working-dir: ./mcp
          - package: devkit
            pypi-name: acex-devkit
            should-publish-output: devkit-should-publish
            working-dir: ./devkit

    steps:
    - name: Check if should publish
      id: should-publish
      run: |
        SHOULD_PUBLISH="${{ needs.check-versions.outputs[matrix.should-publish-output] }}"
        echo "should-publish=$SHOULD_PUBLISH" >> $GITHUB_OUTPUT
        if [ "$SHOULD_PUBLISH" = "true" ]; then
          echo "✅ Will build ${{ matrix.pypi-name }} — publiceras automatiskt efter build"
        else
          echo "⏭️  Skipping ${{ matrix.pypi-name }} - already published"
        fi

    - name: Checkout code
      if: steps.should-publish.outputs.should-publish == 'true'
      uses: actions/checkout@v5

    - name: Set up Python 3.13
      if: steps.should-publish.outputs.should-publish == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install Poetry
      if: steps.should-publish.outputs.should-publish == 'true'
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Update lock file
      if: steps.should-publish.outputs.should-publish == 'true'
      working-directory: ${{ matrix.working-dir }}
      run: poetry lock

    - name: Install dependencies - ${{ matrix.package }}
      if: steps.should-publish.outputs.should-publish == 'true'
      working-directory: ${{ matrix.working-dir }}
      run: poetry install --no-interaction

    - name: Switch dependencies to version (prod)
      if: steps.should-publish.outputs.should-publish == 'true' && matrix.package == 'backend'
      working-directory: ./backend
      run: bash switch_deps.sh prod

    - name: Switch acex-client dependency to version (prod)
      if: steps.should-publish.outputs.should-publish == 'true' && matrix.package == 'cli'
      working-directory: ./cli
      run: bash switch_acex_client_dep.sh prod

    - name: Switch dependencies to version (prod)
      if: steps.should-publish.outputs.should-publish == 'true' && matrix.package == 'client'
      working-directory: ./client
      run: bash switch_deps.sh prod

    - name: Build package
      if: steps.should-publish.outputs.should-publish == 'true'
      working-directory: ${{ matrix.working-dir }}
      run: poetry build

    - name: Release summary
      if: steps.should-publish.outputs.should-publish == 'true'
      working-directory: ${{ matrix.working-dir }}
      run: |
        VERSION=$(poetry version -s)
        echo "### 📦 ${{ matrix.pypi-name }}" >> $GITHUB_STEP_SUMMARY
        echo "Byggd version **$VERSION** — publiceras automatiskt till PyPI i nästa steg." >> $GITHUB_STEP_SUMMARY

    - name: Upload build artifact
      if: steps.should-publish.outputs.should-publish == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.package }}
        path: ${{ matrix.working-dir }}/dist/
        retention-days: 1

  publish-packages:
    name: Publish ${{ matrix.package }}
    needs: [check-versions, build-packages]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Krävs för Trusted Publisher (OIDC)
      contents: read
    if: github.ref == 'refs/heads/main'
    # Ingen manuell godkännande-gate längre — skyddet ligger i branch
    # protection på `main` (PR + gröna checks krävs innan merge).
    strategy:
      fail-fast: false
      matrix:
        package: [backend, cli, client, mcp, devkit]
        include:
          - package: backend
            pypi-name: acex
            should-publish-output: backend-should-publish
            working-dir: ./backend
          - package: cli
            pypi-name: acex-cli
            should-publish-output: cli-should-publish
            working-dir: ./cli
          - package: client
            pypi-name: acex-client
            should-publish-output: client-should-publish
            working-dir: ./client
          - package: mcp
            pypi-name: acex-mcp-server
            should-publish-output: mcp-should-publish
            working-dir: ./mcp
          - package: devkit
            pypi-name: acex-devkit
            should-publish-output: devkit-should-publish
            working-dir: ./devkit

    steps:
    - name: Check if should publish
      id: should-publish
      run: echo "should-publish=${{ needs.check-versions.outputs[matrix.should-publish-output] }}" >> $GITHUB_OUTPUT

    - name: Download build artifact
      if: steps.should-publish.outputs.should-publish == 'true'
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ matrix.package }}
        path: ${{ matrix.working-dir }}/dist/

    - name: Publish to PyPI using Trusted Publisher
      if: steps.should-publish.outputs.should-publish == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: ${{ matrix.working-dir }}/dist/
        verbose: true

    - name: Release summary
      if: steps.should-publish.outputs.should-publish == 'true'
      run: |
        VERSION=$(ls ${{ matrix.working-dir }}/dist/*.tar.gz | head -1 | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+[^.]*)\.tar\.gz/\1/')
        echo "### 📦 ${{ matrix.pypi-name }}" >> $GITHUB_STEP_SUMMARY
        echo "Publicerad version **$VERSION** till PyPI." >> $GITHUB_STEP_SUMMARY


  # Drivers below, slightly different logic

  check-driver-versions:
    name: Check driver version ${{ matrix.driver }}
    runs-on: ubuntu-latest
    outputs:
      cisco-ios-cli-should-publish: ${{ steps.check-cisco-ios-cli.outputs.should-publish }}
      cisco-ios-cli-version: ${{ steps.check-cisco-ios-cli.outputs.version }}
      juniper-junos-cli-should-publish: ${{ steps.check-juniper-junos-cli.outputs.should-publish }}
      juniper-junos-cli-version: ${{ steps.check-juniper-junos-cli.outputs.version }}
    strategy:
      matrix:
        driver: [cisco_ios_cli, juniper_junos_cli]
        include:
          - driver: cisco_ios_cli
            pypi-name: acex-driver-cisco-ioscli
          - driver: juniper_junos_cli
            pypi-name: acex-driver-juniper-junoscli
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Get driver version
        id: get-version
        working-directory: ./drivers/${{ matrix.driver }}
        run: |
          VERSION=$(poetry version -s)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Driver version: $VERSION"

      - name: Check if driver version exists on PyPI
        id: check-pypi
        run: |
          PACKAGE_NAME="${{ matrix.pypi-name }}"
          VERSION="${{ steps.get-version.outputs.version }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${PACKAGE_NAME}/${VERSION}/json")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "should-publish=false" >> $GITHUB_OUTPUT
            echo "⏭️  Version $VERSION already exists on PyPI - skipping"
          else
            echo "should-publish=true" >> $GITHUB_OUTPUT
            echo "✅ Version $VERSION is new - will build and publish"
          fi

      - name: Set matrix output
        id: check-cisco-ios-cli
        if: matrix.driver == 'cisco_ios_cli'
        run: |
          echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT
          echo "version=${{ steps.get-version.outputs.version }}" >> $GITHUB_OUTPUT
      - name: Set matrix output
        id: check-juniper-junos-cli
        if: matrix.driver == 'juniper_junos_cli'
        run: |
          echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT
          echo "version=${{ steps.get-version.outputs.version }}" >> $GITHUB_OUTPUT

  version-summary:
    name: Version summary
    needs: [check-versions, check-driver-versions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write combined summary
        env:
          BACKEND_VERSION: ${{ needs.check-versions.outputs.backend-version }}
          BACKEND_SHOULD_PUBLISH: ${{ needs.check-versions.outputs.backend-should-publish }}
          CLI_VERSION: ${{ needs.check-versions.outputs.cli-version }}
          CLI_SHOULD_PUBLISH: ${{ needs.check-versions.outputs.cli-should-publish }}
          CLIENT_VERSION: ${{ needs.check-versions.outputs.client-version }}
          CLIENT_SHOULD_PUBLISH: ${{ needs.check-versions.outputs.client-should-publish }}
          MCP_VERSION: ${{ needs.check-versions.outputs.mcp-version }}
          MCP_SHOULD_PUBLISH: ${{ needs.check-versions.outputs.mcp-should-publish }}
          DEVKIT_VERSION: ${{ needs.check-versions.outputs.devkit-version }}
          DEVKIT_SHOULD_PUBLISH: ${{ needs.check-versions.outputs.devkit-should-publish }}
          CISCO_VERSION: ${{ needs.check-driver-versions.outputs.cisco-ios-cli-version }}
          CISCO_SHOULD_PUBLISH: ${{ needs.check-driver-versions.outputs.cisco-ios-cli-should-publish }}
          JUNIPER_VERSION: ${{ needs.check-driver-versions.outputs.juniper-junos-cli-version }}
          JUNIPER_SHOULD_PUBLISH: ${{ needs.check-driver-versions.outputs.juniper-junos-cli-should-publish }}
        run: |
          row() {
            local name="$1" version="$2" should_publish="$3"
            if [ "$should_publish" = "true" ]; then
              echo "| \`$name\` | $version | ✅ Ny — publiceras automatiskt |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| \`$name\` | $version | ⏭️ Redan publicerad |" >> $GITHUB_STEP_SUMMARY
            fi
          }

          echo "## 📦 Versionsstatus" >> $GITHUB_STEP_SUMMARY
          echo "| Paket | Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          row "acex" "$BACKEND_VERSION" "$BACKEND_SHOULD_PUBLISH"
          row "acex-cli" "$CLI_VERSION" "$CLI_SHOULD_PUBLISH"
          row "acex-client" "$CLIENT_VERSION" "$CLIENT_SHOULD_PUBLISH"
          row "acex-mcp-server" "$MCP_VERSION" "$MCP_SHOULD_PUBLISH"
          row "acex-devkit" "$DEVKIT_VERSION" "$DEVKIT_SHOULD_PUBLISH"
          row "acex-driver-cisco-ioscli" "$CISCO_VERSION" "$CISCO_SHOULD_PUBLISH"
          row "acex-driver-juniper-junoscli" "$JUNIPER_VERSION" "$JUNIPER_SHOULD_PUBLISH"

  build-drivers:
    name: Build Driver ${{ matrix.driver }}
    needs: check-driver-versions
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        driver: [cisco_ios_cli, juniper_junos_cli]
        include:
          - driver: cisco_ios_cli
            pypi-name: acex-driver-cisco-ioscli
            should-publish-output: cisco-ios-cli-should-publish
          - driver: juniper_junos_cli
            pypi-name: acex-driver-juniper-junoscli
            should-publish-output: juniper-junos-cli-should-publish
    steps:
      - name: Check if should publish
        id: should-publish
        run: |
          SHOULD_PUBLISH="${{ needs.check-driver-versions.outputs[matrix.should-publish-output] }}"
          echo "should-publish=$SHOULD_PUBLISH" >> $GITHUB_OUTPUT
          if [ "$SHOULD_PUBLISH" = "true" ]; then
            echo "✅ Will build ${{ matrix.pypi-name }} — publiceras automatiskt efter build"
          else
            echo "⏭️  Skipping ${{ matrix.pypi-name }} - already published"
          fi

      - name: Checkout code
        if: steps.should-publish.outputs.should-publish == 'true'
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        if: steps.should-publish.outputs.should-publish == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        if: steps.should-publish.outputs.should-publish == 'true'
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Update lock file
        if: steps.should-publish.outputs.should-publish == 'true'
        working-directory: ./drivers/${{ matrix.driver }}
        run: poetry lock

      - name: Install dependencies - ${{ matrix.driver }}
        if: steps.should-publish.outputs.should-publish == 'true'
        working-directory: ./drivers/${{ matrix.driver }}
        run: poetry install --no-interaction

      - name: Switch dependencies to version (prod)
        if: steps.should-publish.outputs.should-publish == 'true'
        working-directory: ./drivers/${{ matrix.driver }}
        run: bash switch_deps.sh prod

      - name: Build driver package
        if: steps.should-publish.outputs.should-publish == 'true'
        working-directory: ./drivers/${{ matrix.driver }}
        run: poetry build

      - name: Release summary
        if: steps.should-publish.outputs.should-publish == 'true'
        working-directory: ./drivers/${{ matrix.driver }}
        run: |
          VERSION=$(poetry version -s)
          echo "### 📦 ${{ matrix.pypi-name }}" >> $GITHUB_STEP_SUMMARY
          echo "Byggd version **$VERSION** — publiceras automatiskt till PyPI i nästa steg." >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        if: steps.should-publish.outputs.should-publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.driver }}
          path: ./drivers/${{ matrix.driver }}/dist/
          retention-days: 1

  publish-drivers:
    name: Publish Driver ${{ matrix.driver }}
    needs: [check-driver-versions, build-drivers]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: github.ref == 'refs/heads/main'
    # Ingen manuell godkännande-gate längre — se publish-packages ovan.
    strategy:
      fail-fast: false
      matrix:
        driver: [cisco_ios_cli, juniper_junos_cli]
        include:
          - driver: cisco_ios_cli
            pypi-name: acex-driver-cisco-ioscli
            should-publish-output: cisco-ios-cli-should-publish
          - driver: juniper_junos_cli
            pypi-name: acex-driver-juniper-junoscli
            should-publish-output: juniper-junos-cli-should-publish
    steps:
      - name: Check if should publish
        id: should-publish
        run: echo "should-publish=${{ needs.check-driver-versions.outputs[matrix.should-publish-output] }}" >> $GITHUB_OUTPUT

      - name: Download build artifact
        if: steps.should-publish.outputs.should-publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.driver }}
          path: ./drivers/${{ matrix.driver }}/dist/

      - name: Publish to PyPI using Trusted Publisher
        if: steps.should-publish.outputs.should-publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: drivers/${{ matrix.driver }}/dist/
          verbose: true

      - name: Release summary
        if: steps.should-publish.outputs.should-publish == 'true'
        run: |
          VERSION=$(ls drivers/${{ matrix.driver }}/dist/*.tar.gz | head -1 | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+[^.]*)\.tar\.gz/\1/')
          echo "### 📦 ${{ matrix.pypi-name }}" >> $GITHUB_STEP_SUMMARY
          echo "Publicerad version **$VERSION** till PyPI." >> $GITHUB_STEP_SUMMARY


  # Container images for agents

  check-collection-agent-image:
    name: Check Collection Agent image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      exists: ${{ steps.check-image.outputs.exists }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get version
        id: get-version
        working-directory: ./agents/collection-agent
        run: |
          pip install poetry
          VERSION=$(poetry version -s)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if image exists
        id: check-image
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/acex-collection-agent/manifests/${VERSION}")

          echo "| Image | Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⏭️  Image version $VERSION already exists - skipping"
            echo "| acex-collection-agent | $VERSION | ⏭️ Redan pushad |" >> $GITHUB_STEP_SUMMARY
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Image version $VERSION is new - will build and push"
            echo "| acex-collection-agent | $VERSION | ✅ Ny version — pushas automatiskt |" >> $GITHUB_STEP_SUMMARY
          fi

  build-and-push-collection-agent:
    name: Build & Push Collection Agent
    needs: [check-collection-agent-image, publish-packages, publish-drivers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main' && needs.check-collection-agent-image.outputs.exists == 'false'
    # Ingen manuell godkännande-gate längre — se publish-packages ovan.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Switch client dependencies to version (prod)
        working-directory: ./client
        run: bash switch_deps.sh prod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agents/collection-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/acex-collection-agent:${{ needs.check-collection-agent-image.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/acex-collection-agent:latest

  check-telemetry-agent-image:
    name: Check Telemetry Agent image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      exists: ${{ steps.check-image.outputs.exists }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get version
        id: get-version
        working-directory: ./agents/telemetry-agent
        run: |
          pip install poetry
          VERSION=$(poetry version -s)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if image exists
        id: check-image
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/acex-telemetry-agent/manifests/${VERSION}")

          echo "| Image | Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⏭️  Image version $VERSION already exists - skipping"
            echo "| acex-telemetry-agent | $VERSION | ⏭️ Redan pushad |" >> $GITHUB_STEP_SUMMARY
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Image version $VERSION is new - will build and push"
            echo "| acex-telemetry-agent | $VERSION | ✅ Ny version — pushas automatiskt |" >> $GITHUB_STEP_SUMMARY
          fi

  build-and-push-telemetry-agent:
    name: Build & Push Telemetry Agent
    needs: [check-telemetry-agent-image, publish-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main' && needs.check-telemetry-agent-image.outputs.exists == 'false'
    # Ingen manuell godkännande-gate längre — se publish-packages ovan.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Switch client dependencies to version (prod)
        working-directory: ./client
        run: bash switch_deps.sh prod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agents/telemetry-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/acex-telemetry-agent:${{ needs.check-telemetry-agent-image.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/acex-telemetry-agent:latest