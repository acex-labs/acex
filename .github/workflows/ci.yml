  check-telemetry-agent-image:
    name: Check Telemetry Agent image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      exists: ${{ steps.check-image.outputs.exists }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get version
        id: get-version
        working-directory: ./agents/telemetry-agent
        run: |
          pip install poetry
          VERSION=$(poetry version -s)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if image exists
        id: check-image
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/acex-telemetry-agent/manifests/${VERSION}")

          echo "| Image | Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⏭️  Image version $VERSION already exists - skipping"
            echo "| acex-telemetry-agent | $VERSION | ⏭️ Redan pushad |" >> $GITHUB_STEP_SUMMARY
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Image version $VERSION is new - will build and push"
            echo "| acex-telemetry-agent | $VERSION | ✅ Ny version — kommer pushas (kräver godkännande) |" >> $GITHUB_STEP_SUMMARY
          fi

