name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check ."
        continue-on-error: true # Rapporterande läge tills de 2432 befintliga felen är åtgärdade.

      - name: Check formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check ."
        continue-on-error: true # Rapporterande läge tills det initiala fel-bruset är åtgärdat.

  unit-tests:
    name: Unit tests ${{ matrix.component }}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        component: [backend, cli, client, mcp, devkit, worker]
        include:
          - component: backend
            working-dir: ./backend
          - component: cli
            working-dir: ./cli
          - component: client
            working-dir: ./client
          - component: mcp
            working-dir: ./mcp
          - component: devkit
            working-dir: ./devkit
          - component: worker
            working-dir: ./worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Update lock file
        working-directory: ${{ matrix.working-dir }}
        run: poetry lock

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ matrix.component }}-${{ hashFiles(format('{0}/poetry.lock', matrix.working-dir)) }}

      - name: Install dependencies
        working-directory: ${{ matrix.working-dir }}
        run: poetry install --no-interaction

      - name: Run tests
        working-directory: ${{ matrix.working-dir }}
        run: |
          # GitHub Actions kör run-steg med `set -e`, så vi måste fånga
          # exitkoden via `||` — annars avslutas skriptet redan på raden
          # nedan innan vi hinner tolerera "5 = inga tester" nedan.
          poetry run pytest || code=$?
          code=${code:-0}
          if [ "$code" -eq 5 ]; then
            echo "Inga tester ännu i ${{ matrix.component }} — godkänt tills vidare."
            exit 0
          fi
          exit "$code"

  integration-tests:
    name: Cross-package integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Update lock file
        working-directory: ./tests/integration
        run: poetry lock

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-integration-${{ hashFiles('tests/integration/poetry.lock') }}

      - name: Install dependencies
        working-directory: ./tests/integration
        run: poetry install --no-interaction

      - name: Run integration tests
        working-directory: ./tests/integration
        run: poetry run pytest -v

  veracode-scan:
    name: Veracode scan ${{ matrix.component }}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # En delad Application Profile (acex-framework) för alla paket/drivers.
        # sandboxname är unik per komponent nedan så att flera scans i samma PR
        # inte skriver över varandra i samma sandbox.
        component: [backend, cli, client, mcp, devkit, cisco_ios_cli, juniper_junos_cli]
        include:
          - component: backend
            working-dir: ./backend
          - component: cli
            working-dir: ./cli
          - component: client
            working-dir: ./client
          - component: mcp
            working-dir: ./mcp
          - component: devkit
            working-dir: ./devkit
          - component: cisco_ios_cli
            working-dir: ./drivers/cisco_ios_cli
          - component: juniper_junos_cli
            working-dir: ./drivers/juniper_junos_cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Update lock file (för exakta versioner i SCA-scan)
        working-directory: ${{ matrix.working-dir }}
        run: poetry lock

      - name: Package source for SAST
        working-directory: ${{ matrix.working-dir }}
        run: |
          # Veracode SAST vill ha .py/.html utan tredjepartspaket eller tester.
          find . -name '*.py' -not -path './.venv/*' -not -path '*/tests/*' \
            -print | zip veracode-sast.zip -@

      - name: Veracode static scan (sandbox, per-PR)
        uses: veracode/veracode-uploadandscan-action@0.2.11
        with:
          appname: acex-framework
          createprofile: false
          filepath: ${{ matrix.working-dir }}/veracode-sast.zip
          version: "${{ matrix.component }}-pr-${{ github.event.pull_request.number }}"
          createsandbox: true
          sandboxname: "pr-${{ github.event.pull_request.number }}-${{ matrix.component }}"
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}

      - name: Veracode SCA scan
        working-directory: ${{ matrix.working-dir }}
        env:
          SRCCLR_API_TOKEN: ${{ secrets.VERACODE_AGENT_TOKEN }}
        run: curl -sSL https://sca-downloads.veracode.com/ci.sh | sh
        continue-on-error: true # Rapporterande läge — srcclr kan annars faila steget på befintliga fynd.
  check-versions:
    name: Check version ${{ matrix.package }}
    runs-on: ubuntu-latest
    outputs:
      backend-should-publish: ${{ steps.check-backend.outputs.should-publish }}
      cli-should-publish: ${{ steps.check-cli.outputs.should-publish }}
      client-should-publish: ${{ steps.check-client.outputs.should-publish }}
      mcp-should-publish: ${{ steps.check-mcp.outputs.should-publish }}
      devkit-should-publish: ${{ steps.check-devkit.outputs.should-publish }}
    strategy:
      matrix:
        package: [backend, cli, client, mcp, devkit]
        include:
          - package: backend
            pypi-name: acex
            working-dir: ./backend
          - package: cli
            pypi-name: acex-cli
            working-dir: ./cli
          - package: client
            pypi-name: acex-client
            working-dir: ./client
          - package: mcp
            pypi-name: acex-mcp-server
            working-dir: ./mcp
          - package: devkit
            pypi-name: acex-devkit
            working-dir: ./devkit
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
    
    - name: Get package version
      id: get-version
      working-directory: ${{ matrix.working-dir }}
      run: |
        VERSION=$(poetry version -s)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Package version: $VERSION"
    
    - name: Check if version exists on PyPI
      id: check-pypi
      run: |
        PACKAGE_NAME="${{ matrix.pypi-name }}"
        VERSION="${{ steps.get-version.outputs.version }}"
        
        # Kolla om versionen redan finns på PyPI
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${PACKAGE_NAME}/${VERSION}/json")

        echo "| Paket | Version | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

        if [ "$HTTP_CODE" = "200" ]; then
          echo "should-publish=false" >> $GITHUB_OUTPUT
          echo "⏭️  Version $VERSION already exists on PyPI - skipping"
          echo "| \`$PACKAGE_NAME\` | $VERSION | ⏭️ Redan publicerad |" >> $GITHUB_STEP_SUMMARY
        else
          echo "should-publish=true" >> $GITHUB_OUTPUT
          echo "✅ Version $VERSION is new - will build and publish"
          echo "| \`$PACKAGE_NAME\` | $VERSION | ✅ Ny version — kommer publiceras (kräver godkännande) |" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Set matrix output
      id: check-backend
      if: matrix.package == 'backend'
      run: echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT
    
    - name: Set matrix output
      id: check-cli
      if: matrix.package == 'cli'
      run: echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT
    
    - name: Set matrix output
      id: check-client
      if: matrix.package == 'client'
      run: echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT
    
    - name: Set matrix output
      id: check-mcp
      if: matrix.package == 'mcp'
      run: echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT
    
    - name: Set matrix output
      id: check-devkit
      if: matrix.package == 'devkit'
      run: echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT

  build-packages:
    name: Build ${{ matrix.package }}
    needs: check-versions
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false  # Fortsätt med andra paket även om ett failar
      matrix:
        package: [backend, cli, client, mcp, devkit]
        include:
          - package: backend
            pypi-name: acex
            should-publish-output: backend-should-publish
            working-dir: ./backend
          - package: cli
            pypi-name: acex-cli
            should-publish-output: cli-should-publish
            working-dir: ./cli
          - package: client
            pypi-name: acex-client
            should-publish-output: client-should-publish
            working-dir: ./client
          - package: mcp
            pypi-name: acex-mcp-server
            should-publish-output: mcp-should-publish
            working-dir: ./mcp
          - package: devkit
            pypi-name: acex-devkit
            should-publish-output: devkit-should-publish
            working-dir: ./devkit

    steps:
    - name: Check if should publish
      id: should-publish
      run: |
        SHOULD_PUBLISH="${{ needs.check-versions.outputs[matrix.should-publish-output] }}"
        echo "should-publish=$SHOULD_PUBLISH" >> $GITHUB_OUTPUT
        if [ "$SHOULD_PUBLISH" = "true" ]; then
          echo "✅ Will build ${{ matrix.pypi-name }} — publish väntar på godkännande"
        else
          echo "⏭️  Skipping ${{ matrix.pypi-name }} - already published"
        fi

    - name: Checkout code
      if: steps.should-publish.outputs.should-publish == 'true'
      uses: actions/checkout@v5

    - name: Set up Python 3.13
      if: steps.should-publish.outputs.should-publish == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install Poetry
      if: steps.should-publish.outputs.should-publish == 'true'
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Update lock file
      if: steps.should-publish.outputs.should-publish == 'true'
      working-directory: ${{ matrix.working-dir }}
      run: poetry lock

    - name: Install dependencies - ${{ matrix.package }}
      if: steps.should-publish.outputs.should-publish == 'true'
      working-directory: ${{ matrix.working-dir }}
      run: poetry install --no-interaction

    - name: Switch dependencies to version (prod)
      if: steps.should-publish.outputs.should-publish == 'true' && matrix.package == 'backend'
      working-directory: ./backend
      run: bash switch_deps.sh prod

    - name: Switch acex-client dependency to version (prod)
      if: steps.should-publish.outputs.should-publish == 'true' && matrix.package == 'cli'
      working-directory: ./cli
      run: bash switch_acex_client_dep.sh prod

    - name: Switch dependencies to version (prod)
      if: steps.should-publish.outputs.should-publish == 'true' && matrix.package == 'client'
      working-directory: ./client
      run: bash switch_deps.sh prod

    - name: Build package
      if: steps.should-publish.outputs.should-publish == 'true'
      working-directory: ${{ matrix.working-dir }}
      run: poetry build

    - name: Release summary (väntar på godkännande)
      if: steps.should-publish.outputs.should-publish == 'true'
      working-directory: ${{ matrix.working-dir }}
      run: |
        VERSION=$(poetry version -s)
        echo "### 📦 ${{ matrix.pypi-name }}" >> $GITHUB_STEP_SUMMARY
        echo "Byggd version **$VERSION** — väntar på godkännande innan publish till PyPI." >> $GITHUB_STEP_SUMMARY

    - name: Upload build artifact
      if: steps.should-publish.outputs.should-publish == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.package }}
        path: ${{ matrix.working-dir }}/dist/
        retention-days: 1

  publish-packages:
    name: Publish ${{ matrix.package }}
    needs: [check-versions, build-packages]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Krävs för Trusted Publisher (OIDC)
      contents: read
    if: github.ref == 'refs/heads/main'
    environment: release # Enda gated jobbet — kräver manuellt godkännande innan publish.
    strategy:
      fail-fast: false
      matrix:
        package: [backend, cli, client, mcp, devkit]
        include:
          - package: backend
            pypi-name: acex
            should-publish-output: backend-should-publish
            working-dir: ./backend
          - package: cli
            pypi-name: acex-cli
            should-publish-output: cli-should-publish
            working-dir: ./cli
          - package: client
            pypi-name: acex-client
            should-publish-output: client-should-publish
            working-dir: ./client
          - package: mcp
            pypi-name: acex-mcp-server
            should-publish-output: mcp-should-publish
            working-dir: ./mcp
          - package: devkit
            pypi-name: acex-devkit
            should-publish-output: devkit-should-publish
            working-dir: ./devkit

    steps:
    - name: Check if should publish
      id: should-publish
      run: echo "should-publish=${{ needs.check-versions.outputs[matrix.should-publish-output] }}" >> $GITHUB_OUTPUT

    - name: Download build artifact
      if: steps.should-publish.outputs.should-publish == 'true'
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ matrix.package }}
        path: ${{ matrix.working-dir }}/dist/

    - name: Publish to PyPI using Trusted Publisher
      if: steps.should-publish.outputs.should-publish == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: ${{ matrix.working-dir }}/dist/
        verbose: true

    - name: Release summary
      if: steps.should-publish.outputs.should-publish == 'true'
      run: |
        VERSION=$(ls ${{ matrix.working-dir }}/dist/*.tar.gz | head -1 | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+[^.]*)\.tar\.gz/\1/')
        echo "### 📦 ${{ matrix.pypi-name }}" >> $GITHUB_STEP_SUMMARY
        echo "Publicerad version **$VERSION** till PyPI." >> $GITHUB_STEP_SUMMARY


  # Drivers below, slightly different logic

  check-driver-versions:
    name: Check driver version ${{ matrix.driver }}
    runs-on: ubuntu-latest
    outputs:
      cisco-ios-cli-should-publish: ${{ steps.check-cisco-ios-cli.outputs.should-publish }}
      juniper-junos-cli-should-publish: ${{ steps.check-juniper-junos-cli.outputs.should-publish }}
    strategy:
      matrix:
        driver: [cisco_ios_cli, juniper_junos_cli]
        include:
          - driver: cisco_ios_cli
            pypi-name: acex-driver-cisco-ioscli
          - driver: juniper_junos_cli
            pypi-name: acex-driver-juniper-junoscli
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Get driver version
        id: get-version
        working-directory: ./drivers/${{ matrix.driver }}
        run: |
          VERSION=$(poetry version -s)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Driver version: $VERSION"

      - name: Check if driver version exists on PyPI
        id: check-pypi
        run: |
          PACKAGE_NAME="${{ matrix.pypi-name }}"
          VERSION="${{ steps.get-version.outputs.version }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${PACKAGE_NAME}/${VERSION}/json")

          echo "| Paket | Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          if [ "$HTTP_CODE" = "200" ]; then
            echo "should-publish=false" >> $GITHUB_OUTPUT
            echo "⏭️  Version $VERSION already exists on PyPI - skipping"
            echo "| \`$PACKAGE_NAME\` | $VERSION | ⏭️ Redan publicerad |" >> $GITHUB_STEP_SUMMARY
          else
            echo "should-publish=true" >> $GITHUB_OUTPUT
            echo "✅ Version $VERSION is new - will build and publish"
            echo "| \`$PACKAGE_NAME\` | $VERSION | ✅ Ny version — kommer publiceras (kräver godkännande) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set matrix output
        id: check-cisco-ios-cli
        if: matrix.driver == 'cisco_ios_cli'
        run: echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT
      - name: Set matrix output
        id: check-juniper-junos-cli
        if: matrix.driver == 'juniper_junos_cli'
        run: echo "should-publish=${{ steps.check-pypi.outputs.should-publish }}" >> $GITHUB_OUTPUT

  build-drivers:
    name: Build Driver ${{ matrix.driver }}
    needs: check-driver-versions
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        driver: [cisco_ios_cli, juniper_junos_cli]
        include:
          - driver: cisco_ios_cli
            pypi-name: acex-driver-cisco-ioscli
            should-publish-output: cisco-ios-cli-should-publish
          - driver: juniper_junos_cli
            pypi-name: acex-driver-juniper-junoscli
            should-publish-output: juniper-junos-cli-should-publish
    steps:
      - name: Check if should publish
        id: should-publish
        run: |
          SHOULD_PUBLISH="${{ needs.check-driver-versions.outputs[matrix.should-publish-output] }}"
          echo "should-publish=$SHOULD_PUBLISH" >> $GITHUB_OUTPUT
          if [ "$SHOULD_PUBLISH" = "true" ]; then
            echo "✅ Will build ${{ matrix.pypi-name }} — publish väntar på godkännande"
          else
            echo "⏭️  Skipping ${{ matrix.pypi-name }} - already published"
          fi

      - name: Checkout code
        if: steps.should-publish.outputs.should-publish == 'true'
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        if: steps.should-publish.outputs.should-publish == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        if: steps.should-publish.outputs.should-publish == 'true'
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Update lock file
        if: steps.should-publish.outputs.should-publish == 'true'
        working-directory: ./drivers/${{ matrix.driver }}
        run: poetry lock

      - name: Install dependencies - ${{ matrix.driver }}
        if: steps.should-publish.outputs.should-publish == 'true'
        working-directory: ./drivers/${{ matrix.driver }}
        run: poetry install --no-interaction

      - name: Switch dependencies to version (prod)
        if: steps.should-publish.outputs.should-publish == 'true'
        working-directory: ./drivers/${{ matrix.driver }}
        run: bash switch_deps.sh prod

      - name: Build driver package
        if: steps.should-publish.outputs.should-publish == 'true'
        working-directory: ./drivers/${{ matrix.driver }}
        run: poetry build

      - name: Release summary (väntar på godkännande)
        if: steps.should-publish.outputs.should-publish == 'true'
        working-directory: ./drivers/${{ matrix.driver }}
        run: |
          VERSION=$(poetry version -s)
          echo "### 📦 ${{ matrix.pypi-name }}" >> $GITHUB_STEP_SUMMARY
          echo "Byggd version **$VERSION** — väntar på godkännande innan publish till PyPI." >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        if: steps.should-publish.outputs.should-publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.driver }}
          path: ./drivers/${{ matrix.driver }}/dist/
          retention-days: 1

  publish-drivers:
    name: Publish Driver ${{ matrix.driver }}
    needs: [check-driver-versions, build-drivers]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: github.ref == 'refs/heads/main'
    environment: release # Enda gated jobbet — kräver manuellt godkännande innan publish.
    strategy:
      fail-fast: false
      matrix:
        driver: [cisco_ios_cli, juniper_junos_cli]
        include:
          - driver: cisco_ios_cli
            pypi-name: acex-driver-cisco-ioscli
            should-publish-output: cisco-ios-cli-should-publish
          - driver: juniper_junos_cli
            pypi-name: acex-driver-juniper-junoscli
            should-publish-output: juniper-junos-cli-should-publish
    steps:
      - name: Check if should publish
        id: should-publish
        run: echo "should-publish=${{ needs.check-driver-versions.outputs[matrix.should-publish-output] }}" >> $GITHUB_OUTPUT

      - name: Download build artifact
        if: steps.should-publish.outputs.should-publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.driver }}
          path: ./drivers/${{ matrix.driver }}/dist/

      - name: Publish to PyPI using Trusted Publisher
        if: steps.should-publish.outputs.should-publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: drivers/${{ matrix.driver }}/dist/
          verbose: true

      - name: Release summary
        if: steps.should-publish.outputs.should-publish == 'true'
        run: |
          VERSION=$(ls drivers/${{ matrix.driver }}/dist/*.tar.gz | head -1 | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+[^.]*)\.tar\.gz/\1/')
          echo "### 📦 ${{ matrix.pypi-name }}" >> $GITHUB_STEP_SUMMARY
          echo "Publicerad version **$VERSION** till PyPI." >> $GITHUB_STEP_SUMMARY


  # Container images for agents

  check-collection-agent-image:
    name: Check Collection Agent image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      exists: ${{ steps.check-image.outputs.exists }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get version
        id: get-version
        working-directory: ./agents/collection-agent
        run: |
          pip install poetry
          VERSION=$(poetry version -s)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if image exists
        id: check-image
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/acex-collection-agent/manifests/${VERSION}")

          echo "| Image | Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⏭️  Image version $VERSION already exists - skipping"
            echo "| acex-collection-agent | $VERSION | ⏭️ Redan pushad |" >> $GITHUB_STEP_SUMMARY
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Image version $VERSION is new - will build and push"
            echo "| acex-collection-agent | $VERSION | ✅ Ny version — kommer pushas (kräver godkännande) |" >> $GITHUB_STEP_SUMMARY
          fi

  build-and-push-collection-agent:
    name: Build & Push Collection Agent
    needs: [check-collection-agent-image, publish-packages, publish-drivers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main' && needs.check-collection-agent-image.outputs.exists == 'false'
    environment: release # Enda gated jobbet — kräver manuellt godkännande innan push.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Switch client dependencies to version (prod)
        working-directory: ./client
