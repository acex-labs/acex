[tool.poetry]
name = "acex-client"
version = "4.7.0"
description = "ACE-X CLIENT - Client for ACE-X"
authors = ["Johan Lahti <johan.lahti@acebit.se>"]
readme = "README.md"
license = "AGPL-3.0"
keywords = ["automation", "control"]
packages = [
    { include = "acex_client", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.13"
httpx = "^0.27.0"
pydantic = "^2.12.5"
acex-devkit = { path = "../devkit", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
respx = "^0.21.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
