[tool.poetry]
name = "acex-driver-cisco-ioscliv2"
version = "0.0.1"
description = "ACE-X Driver: Cisco IOS-XE CLI SSH (v2)"
authors = ["Johan Lahti <johan.lahti@acebit.se>"]
license = "AGPL-3.0"
homepage = "https://github.com/acex-labs/acex"
repository = "https://github.com/acex-labs/acex"

packages = [
    { include = "acex_driver_cisco_ioscliv2", from="src" }
]

[tool.poetry.dependencies]
python = "^3.13"
scrapli = {version = "^2024.1.30", extras = ["asyncssh"]}
asyncssh = "^2.14"
pyyaml = "^6.0.2"
acex-devkit = { path = "../../devkit", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."acex.neds"]
cisco_ios_cliv2 = "acex_driver_cisco_ioscliv2.cisco_ios_cliv2:CiscoIOSCLIDriverV2"
[dependency-groups]
dev = [
    "ipython (>=9.10.0,<10.0.0)"
]
