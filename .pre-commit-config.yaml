repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Förhindrar commits av env-filer (.env, .env.*, *.env, .envrc) som
      # kan innehålla hemligheter. Templates (*.env.example) är tillåtna.
      - id: check-no-env-files
        name: Check for env files
        entry: scripts/check_no_env_files.sh
        language: script

      # Körs efter varje checkout (t.ex. `git checkout -b ...`) och varnar
      # direkt om branchnamnet bryter mot namnstandarden. En riktig
      # blockering sker i CI — se .github/workflows/ci.yml.
      - id: branch-name
        name: Check branch name
        entry: scripts/check_branch_name.sh
        language: script
        stages: [post-checkout]
        always_run: true
        pass_filenames: false